<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      color: #fff;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    label {
      font-size: 13px;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider {
      background: #6c63ff;
    }
    input:checked + .slider::before {
      transform: translateX(18px);
    }
    .status {
      font-size: 11px;
      color: #888;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>Teams Blend In</h1>

  <div class="toggle-row">
    <label for="enabled">Match the room</label>
    <label class="switch" for="enabled">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status" id="status">Raises your hand when 10+ others have theirs up. Lowers when fewer.</div>

  <script src="popup.js"></script>
</body>
</html>
